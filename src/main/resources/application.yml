server:
  port: ${PORT:8080}
spring:
  application:
    name: colegio-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/colegio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:3}
    lock-time-duration-minutes: ${LOCK_TIME_MINUTES:15}
logging:
  level:
    root: INFO
    pe.edu.pucp.colegio: DEBUG
  file:
    name: ${LOG_FILE:logs/colegio-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB

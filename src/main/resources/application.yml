server:
    port: ${PORT:8080}
spring:
    application:
        name: colegio-backend
    # Variables locales desde .env (no versionado). Es opcional: en servidores y CI llegan del entorno.
    config:
        import: optional:file:.env[.properties]
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 11MB
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/colegio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000
    data:
        web:
            pageable:
                max-page-size: 100
app:
    jwt:
        secret: ${JWT_SECRET}
        expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    security:
        max-login-attempts: ${MAX_LOGIN_ATTEMPTS:3}
        lock-time-duration-minutes: ${LOCK_TIME_MINUTES:15}
    mail:
      from: ${MAIL_FROM:${MAIL_USERNAME:}}
    password-reset:
      frontend-url: ${FRONTEND_PASSWORD_RESET_URL:http://localhost:3000/restablecer-contrasena}
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
logging:
    level:
        root: INFO
        pe.edu.pucp.colegio: DEBUG
    file:
        name: ${LOG_FILE:logs/colegio-backend.log}
    logback:
        rollingpolicy:
            max-file-size: 10MB
            max-history: 14
            total-size-cap: 200MB

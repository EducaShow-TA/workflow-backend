name: Backend CI

on:
  push:
  pull_request:
    branches: [Development, main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Verify formatting, tests, and coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Confirm JaCoCo coverage rules match classes
        if: success()
        shell: bash
        run: |
          report=target/site/jacoco/jacoco.csv
          test -s "$report"
          awk -F, 'NR > 1 && $2 == "pe.edu.pucp.colegio.security.service.impl" { security = 1 }
            NR > 1 && $2 == "pe.edu.pucp.colegio.common.service" { common = 1 }
            END { exit !(security && common) }' "$report" || {
              echo 'JaCoCo CSV does not contain classes from both coverage-rule packages.' >&2
              exit 1
            }

      - name: Summarize JaCoCo coverage
        if: always()
        shell: bash
        run: |
          report=target/site/jacoco/jacoco.csv
          if [[ ! -s "$report" ]]; then
            echo 'JaCoCo CSV report was not generated.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 { instructions_missed += $4; instructions_covered += $5; branches_missed += $6; branches_covered += $7 }
            END {
              instructions_total = instructions_missed + instructions_covered
              branches_total = branches_missed + branches_covered
              printf "## JaCoCo coverage\n\n";
              printf "| Metric | Covered | Missed | Total | Coverage |\n|---|---:|---:|---:|---:|\n";
              printf "| Instructions | %d | %d | %d | %.1f%% |\n", instructions_covered, instructions_missed, instructions_total, 100 * instructions_covered / instructions_total;
              printf "| Branches | %d | %d | %d | %.1f%% |\n", branches_covered, branches_missed, branches_total, (branches_total ? 100 * branches_covered / branches_total : 100);
            }' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
